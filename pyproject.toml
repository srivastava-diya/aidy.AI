[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidy"
version = "1.0.0"
description = "aidy.AI: a multi-agent research assistant with source-grounded fact-checking, built on CrewAI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Diya" }
]
dependencies = [
    "streamlit>=1.50.0",
    "plotly>=5.20.0",
    "statsmodels>=0.14.0",
    "crewai>=1.0.0",
    "crewai-tools>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

